# Render blueprint (SPEC §6.2): exactly ONE web service on the free instance
# pool; the launcher can also be deployed as a free static site pointing at it.
# Never use Render free Postgres / Key Value (ADR-0003) — set DATABASE_URL to
# Neon and REDIS_URL to Upstash in the dashboard.
services:
  - type: web
    name: debate-mediator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Match the Recall.ai region you use, to keep the audio loop short.
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # All secrets are set in the Render dashboard (sync:false = not in git).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RECALL_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      # Recall builds the bot's display-page and audio-callback URLs from this.
      # Set it to https://<your-service>.onrender.com after the first deploy.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RECALL_REGION
        value: us-west-2
